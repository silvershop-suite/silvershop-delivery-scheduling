---
Name: silvershop-delivery-scheduling
After:
  - silvershop-core
  - silvershop-shipping
---
SilverShop\Model\Order:
  extensions:
    - SilverShop\DeliveryScheduling\Extension\OrderSchedulingExtension
SilverShop\Page\CheckoutPageController:
  extensions:
    - SilverShop\DeliveryScheduling\Extension\ShippingMethodStepExtension
SilverStripe\SiteConfig\SiteConfig:
  extensions:
    - SilverShop\DeliveryScheduling\Extension\DeliveryScheduleSiteConfigExtension

---
Name: silvershop-delivery-scheduling-singlepage
After:
  - '#shopcheckout'
---
# Single-page checkout: append the picker component with an Injector `calls:` entry (core's config has no
# add-component hook; `calls:` composes with other modules' `class:` overrides or calls, see shipping-myparcel).
# The stepped checkout gets the picker through ShippingMethodStepExtension instead.
SilverStripe\Core\Injector\Injector:
  SilverShop\Checkout\SinglePageCheckoutComponentConfig:
    calls:
      - [ addComponent, [ '%$SilverShop\DeliveryScheduling\Checkout\DeliveryScheduleCheckoutComponent', 'SilverShop\Checkout\Component\Notes' ] ]

---
Name: silvershop-delivery-scheduling-store-locations
Only:
  classexists: 'SilverShop\StoreLocations\Model\StoreLocation'
---
# Slots per physical store (silvershop-suite/store-locations): skipped on the store's closed days.
SilverShop\DeliveryScheduling\Model\DeliverySlot:
  extensions:
    - SilverShop\DeliveryScheduling\Extension\DeliverySlotStoreLocationExtension
